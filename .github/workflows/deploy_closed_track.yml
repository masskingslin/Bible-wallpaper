name: Deploy to Google Play

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Release Track (internal, closed, alpha, beta, production)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - closed
          - alpha
          - beta

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (secrets.PLAY_STORE_JSON_KEY != '' && secrets.ANDROID_KEYSTORE_BASE64 != '') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Required Secrets
        run: |
          MISSING_SECRETS=()
          if [ -z "${{ secrets.PLAY_STORE_JSON_KEY }}" ]; then
            MISSING_SECRETS+=("PLAY_STORE_JSON_KEY")
          fi
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            MISSING_SECRETS+=("ANDROID_KEYSTORE_BASE64")
          fi
          if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            MISSING_SECRETS+=("KEYSTORE_PASSWORD")
          fi
          if [ -z "${{ secrets.KEY_ALIAS }}" ]; then
            MISSING_SECRETS+=("KEY_ALIAS")
          fi
          if [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            MISSING_SECRETS+=("KEY_PASSWORD")
          fi

          if [ ${#MISSING_SECRETS[@]} -gt 0 ]; then
            echo "❌ Error: The following required GitHub Secrets are missing or empty:"
            for secret in "${MISSING_SECRETS[@]}"; do
              echo "  - $secret"
            done
            echo ""
            echo "👉 To fix this:"
            echo "1. Go to your GitHub repository -> Settings -> Secrets and variables -> Actions"
            echo "2. Add each missing secret under 'Repository secrets'."
            echo "   - PLAY_STORE_JSON_KEY: Google Play Console service account key JSON (raw or base64)"
            echo "   - ANDROID_KEYSTORE_BASE64: Base64-encoded release keystore (.jks/.keystore)"
            echo "   - KEYSTORE_PASSWORD: Password for the keystore"
            echo "   - KEY_ALIAS: Key alias inside the keystore"
            echo "   - KEY_PASSWORD: Password for the key"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Prepare Google Services Configuration
        run: |
          mkdir -p app
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "Using custom GOOGLE_SERVICES_JSON from repository secrets."
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
          elif [ -f app/google-services.json ] && [ -s app/google-services.json ]; then
            echo "Using existing repository app/google-services.json."
          else
            echo "Generating fallback app/google-services.json for build verification."
            cat << 'EOF' > app/google-services.json
{
  "project_info": {
    "project_number": "100000000000",
    "project_id": "bible-wallpapers-app",
    "storage_bucket": "bible-wallpapers-app.appspot.com"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:100000000000:android:a1b2c3d4e5f6a7b8c9d0e1",
        "android_client_info": {
          "package_name": "com.DK.biblewallpapers"
        }
      },
      "oauth_client": [],
      "api_key": [
        {
          "current_key": "AIzaSyDummyKeyForBuildVerificationOnly123"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": []
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF
          fi
          echo "✅ Successfully configured app/google-services.json ($(wc -c < app/google-services.json) bytes)"

      - name: Decode Google Service Account Key
        run: |
          mkdir -p fastlane
          RAW_KEY='${{ secrets.PLAY_STORE_JSON_KEY }}'
          if echo "$RAW_KEY" | grep -q "^{"; then
            echo "$RAW_KEY" > fastlane/play-store-credentials.json
          else
            echo "$RAW_KEY" | base64 --decode > fastlane/play-store-credentials.json
          fi

      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/release.keystore

      - name: Run Fastlane Deploy
        run: |
          bundle exec fastlane deploy_play_store
        env:
          PLAY_STORE_TRACK: ${{ inputs.track || 'internal' }}
          BUILD_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed AAB Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle-run-${{ github.run_number }}
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
